spring.application.name=ms-catalogo
server.port=8081
server.servlet.context-path=/catalogoMs

# CONFIGURACIÓN DE LA BASE DE DATOS 
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/catalogo_db}
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# CONFIGURACIÓN SWAGGER
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.packages-to-scan=com.seminario.ms_catalogo.controller
springdoc.show-actuator=true

# CONFIGURACIÓN EUREKA
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

# CONFIGURACIÓN DE MICROSERVICIOS EXTERNOS
usuarios.ms.url=${USUARIOS_MS_URL:http://localhost:8080}
pedido.ms.url=${PEDIDO_MS_URL:http://localhost:8082}

# CONFIGURACIÓN JWT
jwt.secret=${JWT_SECRET_KEY}
logging.level.org.springframework.security=DEBUG

management.endpoints.web.exposure.include=health,info,prometheus,circuitbreakers,circuitbreakerevents
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Microservicio de Catálogo - Proyecto Analistas
info.app.version=0.0.1-SNAPSHOT

# CONFIGURACION DE CIRCUIT BREAKER (Resilience4j)
resilience4j.circuitbreaker.instances.usuarioClient.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.usuarioClient.slidingWindowSize=10
resilience4j.circuitbreaker.instances.usuarioClient.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.usuarioClient.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.usuarioClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.usuarioClient.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.usuarioClient.slowCallDurationThreshold=3s
resilience4j.circuitbreaker.instances.usuarioClient.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.usuarioClient.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.usuarioClient.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.usuarioClient.recordExceptions=org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException,java.net.ConnectException,java.net.SocketTimeoutException,java.util.concurrent.TimeoutException
resilience4j.circuitbreaker.instances.usuarioClient.ignoreExceptions=org.springframework.web.client.HttpClientErrorException.BadRequest,org.springframework.web.client.HttpClientErrorException.Unauthorized,org.springframework.web.client.HttpClientErrorException.Forbidden,org.springframework.web.client.HttpClientErrorException.NotFound

# CONFIGURACION DE REINTENTOS
resilience4j.retry.instances.usuarioClient.maxAttempts=3
resilience4j.retry.instances.usuarioClient.waitDuration=1000
resilience4j.retry.instances.usuarioClient.retryExceptions=java.io.IOException,java.net.SocketTimeoutException,org.springframework.web.client.ResourceAccessException

# CONFIGURACIÓN PROMETHEUS
management.metrics.tags.application=${spring.application.name}

# CONFIGURACION KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.spring.json.add.type.headers=false
